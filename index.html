<!-- CATEGORY "МОЇ" -->
<div class="bg-brandCard/90 p-4 rounded-2xl neon-border-purple space-y-3">
  <div class="flex justify-between items-center border-b border-brandBorder pb-2">
    <h2 class="text-xs font-bold uppercase text-neonPurple">
      Категорія <span class="tech-backdrop text-white">"МОЇ"</span>
    </h2>
    <span class="text-xs font-mono font-bold text-white" id="myTotalDisplay">0 €</span>
  </div>

  <!-- Інформаційна панель: Карта та Бонуси (без зрізання каси) -->
  <div class="grid grid-cols-2 gap-2 text-[11px] font-mono">
    <div class="bg-brandDark p-2 rounded border border-brandBorder">
      <span class="text-gray-400 block">💳 На карті:</span>
      <span id="myCardTotal" class="text-neonBlue font-bold text-xs">0 €</span>
    </div>
    <div class="bg-brandDark p-2 rounded border border-brandBorder">
      <span class="text-gray-400 block">🎁 Бонуси (собів.):</span>
      <span id="myBonusCostTotal" class="text-neonPurple font-bold text-xs">0 €</span>
    </div>
  </div>

  <!-- Швидкі кнопки (Quick Buttons) -->
  <div class="space-y-1">
    <span class="text-[10px] text-gray-400 uppercase font-bold">Швидкий розхід:</span>
    <div class="grid grid-cols-3 gap-1.5">
      <button type="button" data-name="Rewe" class="btn-quick-expense py-1 bg-brandDark hover:bg-brandBorder border border-brandBorder rounded text-[11px] font-semibold text-gray-300">
        🛒 Rewe
      </button>
      <button type="button" data-name="Restoran" class="btn-quick-expense py-1 bg-brandDark hover:bg-brandBorder border border-brandBorder rounded text-[11px] font-semibold text-gray-300">
        🍕 Restoran
      </button>
      <button type="button" data-name="Tabak" class="btn-quick-expense py-1 bg-brandDark hover:bg-brandBorder border border-brandBorder rounded text-[11px] font-semibold text-gray-300">
        🚬 Tabak
      </button>
    </div>
  </div>

  <!-- Ручний ввід -->
  <div class="space-y-2 pt-1">
    <div class="flex gap-2">
      <input type="text" id="myExpenseNote" placeholder="Опис" class="w-3/5 p-1.5 bg-brandDark/90 rounded-xl border border-brandBorder text-xs">
      <input type="number" id="myExpenseAmount" placeholder="Сума €" class="w-2/5 p-1.5 bg-brandDark/90 rounded-xl border border-brandBorder text-xs">
    </div>
    <div class="grid grid-cols-2 gap-2">
      <button type="button" id="btnAddIncome" class="py-1.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-xl text-xs font-bold">+ Дохід</button>
      <button type="button" id="btnAddExpense" class="py-1.5 bg-red-500/20 text-red-400 border border-red-500/30 rounded-xl text-xs font-bold">- Розхід</button>
    </div>
  </div>

  <div id="myExpensesList" class="space-y-1.5 max-h-28 overflow-y-auto text-xs pt-2"></div>
</div>
